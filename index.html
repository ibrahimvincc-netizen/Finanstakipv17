<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;margin:0;background:#f5f6fa;color:#17181c;padding:16px;padding-bottom:88px}h1{font-size:28px;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}.hero{background:#4f46e5;color:#fff}.big{font-size:30px;font-weight:800;margin-top:6px}.btn{padding:12px 15px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:700;margin:4px 2px;cursor:pointer}.btn.secondary{background:#eef0f5;color:#222}.btn.danger{background:#dc2626}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);display:flex;justify-content:space-around;padding:10px max(8px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 15px rgba(0,0,0,.08)}.nav button{border:0;background:transparent;font-size:12px;color:#555}.nav button.active{color:#4f46e5;font-weight:800}dialog{border:0;border-radius:18px;width:min(92%,460px);padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.35)}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;margin:6px 0;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{padding:12px 4px;border:1px solid #ddd;background:#fff;border-radius:12px;font-weight:700}.choice.selected{background:#4f46e5;color:#fff;border-color:#4f46e5}.muted{color:#6b7280;font-size:13px}.green{color:#15803d}.red{color:#b91c1c}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;font-size:11px;color:#777;font-weight:700;padding:4px}.day{min-height:42px;border:1px solid #eee;background:#fff;border-radius:9px;padding:6px;font-size:12px;cursor:pointer}.day.inrange{background:#ede9fe;border-color:#c4b5fd}.day.start,.day.end{background:#4f46e5;color:#fff}.day.mutedday{opacity:.35}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f8f8fb;border-radius:13px;padding:12px}.cat{display:flex;justify-content:space-between;padding:8px 0}.small{font-size:12px}.spaced{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef0f5;font-size:12px}

:root{--bg:#f5f6fa;--text:#17181c;--card:#fff;--border:#eee;--input:#fff;--muted:#6b7280;--soft:#f8f8fb;--nav:rgba(255,255,255,.96)}
body{--bg:#f5f6fa;--text:#17181c;--card:#fff;--border:#e5e7eb;--input:#fff;--muted:#6b7280;--soft:#f8f8fb;--nav:rgba(255,255,255,.96);--pill-bg:#eef0f5;--pill-text:#17181c;--nav-text:#555;--green:#15803d;--red:#b91c1c}body.dark{--bg:#101114;--text:#f5f5f7;--card:#1b1c20;--border:#303238;--input:#23252a;--muted:#b8bcc6;--soft:#24262c;--nav:rgba(25,26,30,.96);--pill-bg:#34363d;--pill-text:#f5f5f7;--nav-text:#d5d8df;--green:#4ade80;--red:#fb7185}
body{background:var(--bg);color:var(--text)}.card{background:var(--card)}.row{border-color:var(--border)}.nav{background:var(--nav)}.nav button{color:var(--nav-text)}input,select{background:var(--input);color:var(--text);border-color:var(--border)}input::placeholder{color:var(--muted);opacity:1}.stat{background:var(--soft)}.day{background:var(--card);border-color:var(--border)}.choice{background:var(--card);color:var(--text);border-color:var(--border)}.muted{color:var(--muted)}.pill{background:var(--pill-bg);color:var(--pill-text);font-weight:700}.green{color:var(--green)!important}.red{color:var(--red)!important}.positive{color:var(--green)!important;font-weight:800}.negative{color:var(--red)!important;font-weight:800}.neutral{color:var(--muted)!important;font-weight:800}body.dark dialog{background:var(--card);color:var(--text)}body.dark dialog h1,body.dark dialog h2,body.dark dialog h3,body.dark dialog p,body.dark dialog span,body.dark dialog b,body.dark dialog strong,body.dark label{color:inherit}
.expense-bar{display:flex;width:100%;height:18px;border-radius:999px;overflow:hidden;background:var(--soft);margin:8px 0 12px;box-shadow:inset 0 0 0 1px var(--border)}.expense-bar>div{height:100%;min-width:0}.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:0 0 150px}.donut-hole{width:82px;height:82px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:900;font-size:15px}.legend{flex:1;min-width:180px}.legend>div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.status{padding:10px 12px;border-radius:12px;margin-top:10px;font-weight:700;background:var(--soft);color:var(--text)}.status.ok{color:var(--green)}.status.err{color:var(--red)}.saving{opacity:.6;pointer-events:none}.outflow{color:var(--red)!important;font-weight:800}.debt-total{color:#dc2626!important;font-weight:900}.expense-filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:end}.expense-filter-grid input{padding:6px 7px;margin:2px 0;font-size:13px;height:34px;min-width:0}.expense-filter-grid label{font-size:11px;display:block;margin-left:2px}.expense-filter-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.expense-filter-actions .btn{padding:8px 10px;font-size:12px;margin:0}.paylist{display:grid;gap:8px;margin:8px 0 10px}.payopt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);background:var(--card);border-radius:12px;font-weight:700}.payopt:has(input:checked){border-color:#4f46e5;background:var(--soft)}.payopt input{width:auto;margin:0;accent-color:#4f46e5}

<body>
<div id="app"></div>
<div class="nav"><button id="nav-home" onclick="show('home')">🏠<br>Ana</button><button id="nav-courier" onclick="show('courier')">📦<br>Kurye</button><button id="nav-expense" onclick="show('expense')">💸<br>Gider</button><button id="nav-debt" onclick="show('debt')">💳<br>Borç</button><button id="nav-report" onclick="show('report')">📊<br>Rapor</button><button id="nav-settings" onclick="show('settings')">⚙️<br>Ayar</button><button id="nav-admin" onclick="show('admin')">🛠️<br>Admin</button></div>
<dialog id="d"><div id="m"></div></dialog>
<script>
const k='finansPWA';
const app=document.getElementById('app');
const d=document.getElementById('d');
const m=document.getElementById('m');
const num=v=>{
 const raw=String(v??'').trim().replace(/\s/g,'');
 if(!raw)return NaN;
 let z=raw;
 const hasDot=z.includes('.'),hasComma=z.includes(',');
 if(hasDot&&hasComma){
   if(z.lastIndexOf(',')>z.lastIndexOf('.')) z=z.replace(/\./g,'').replace(',','.');
   else z=z.replace(/,/g,'');
 }else if(hasComma){
   z=z.replace(',','.');
 }
 const n=Number(z); return Number.isFinite(n)?n:NaN;
};
let x=JSON.parse(localStorage.getItem(k)||'null')||{deliveries:[],mileage:[],expenses:[],debts:[],debtPayments:[],logs:[],rate:7.5,firstRate:125,mergedRate:85,categories:['Market','Akaryakıt','Hobi','Eğlence','Fatura','Araç Bakım','Parça Maliyeti']};
if(!Array.isArray(x.deliveries)) x.deliveries=[]; if(!Array.isArray(x.mileage)) x.mileage=[]; if(!Array.isArray(x.expenses)) x.expenses=[]; if(!Array.isArray(x.debts)) x.debts=[]; if(!Array.isArray(x.debtPayments)) x.debtPayments=[]; if(!Array.isArray(x.debtEditHistory)) x.debtEditHistory=[]; if(!Array.isArray(x.logs)) x.logs=[]; if(!Array.isArray(x.categories)) x.categories=['Market','Akaryakıt','Hobi','Eğlence','Fatura','Araç Bakım','Parça Maliyeti']; if(!Number.isFinite(Number(x.rate))||Number(x.rate)===6) x.rate=7.5; if(!Number.isFinite(Number(x.firstRate))) x.firstRate=125; if(!Number.isFinite(Number(x.mergedRate))) x.mergedRate=85; if(!x.invoiceStatus||typeof x.invoiceStatus!=='object') x.invoiceStatus={}; x.debts.forEach(v=>{if((Number(v.remaining)||0)<=0&&!v.closedAt)v.closedAt=today()});
let busy=false;
let pendingUndo=null;
const save=()=>{try{const copy={...x};delete copy.autoBackup;localStorage.setItem(k,JSON.stringify(copy));return true}catch(e){console.error(e);alert('Veriler kaydedilemedi. Tarayıcı depolama alanı kullanılamıyor. Lütfen sayfayı yenileyip tekrar deneyin.');return false}};
const nowISO=()=>new Date().toISOString();
const dt=iso=>new Date(iso||new Date()).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'});
const log=(type,text,amount=0,meta={})=>{x.logs.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),type,text,amount:Number(amount)||0,at:nowISO(),...meta});};
const confirmUndo=(what,fn)=>{pendingUndo=fn;modal(`<h2>Geri Alma</h2><p>${esc(what)} işlemini geri almak istediğinize emin misiniz?</p><button class="btn danger" onclick="executeUndo()">Geri Al</button><button class="btn secondary" onclick="cancelUndo()">Vazgeç</button>`)};
function executeUndo(){const fn=pendingUndo;pendingUndo=null;closeM();if(typeof fn==='function'){try{fn()}catch(e){console.error(e);alert('İşlem geri alınamadı. Lütfen tekrar deneyin.')}}}
function cancelUndo(){pendingUndo=null;closeM()}
const tl=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(n)||0);
const dateStr=d=>{const z=new Date(d);return `${z.getFullYear()}-${String(z.getMonth()+1).padStart(2,'0')}-${String(z.getDate()).padStart(2,'0')}`};
const today=()=>dateStr(new Date());
const sum=a=>a.reduce((s,v)=>s+(Number(v.amount)||0),0);
const incomeFor=arr=>sum(arr.deliveries)+arr.mileage.reduce((s,v)=>s+(Number(v.km)||0)*(Number(v.rate)||0),0);
const inRange=(date,start,end)=>date>=start&&date<=end;
const monthKey=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`;
function monthEnd(y,m){return dateStr(new Date(y,m+1,0,12))}
function invoiceFor(y,m){
 const first=new Date(y,m,1,12), packetEnd=new Date(y,m,25,12), prev=new Date(y,m,0,12);
 const key=monthKey(y,m), packetStart=dateStr(new Date(prev.getFullYear(),prev.getMonth(),26,12)), packetEndStr=dateStr(packetEnd), end=monthEnd(y,m);
 const deliveries=x.deliveries.filter(v=>inRange(v.date,packetStart,packetEndStr));
 const mileage=x.mileage.filter(v=>inRange(v.date,dateStr(first),end));
 const packageAmount=sum(deliveries), kmAmount=mileage.reduce((s,v)=>s+(Number(v.km)||0)*(Number(v.rate)||0),0);
 const payDate=new Date(y,m+1,5,12);
 const status=(x.invoiceStatus&&x.invoiceStatus[key])==='paid'?'paid':'pending';
 return {key,year:y,month:m,packetStart,packetEnd:packetEndStr,end,mileageStart:dateStr(first),deliveries,mileage,packageAmount,kmAmount,total:packageAmount+kmAmount,payDate:dateStr(payDate),status};
}
function invoiceLabel(inv){return new Date(inv.year,inv.month,1,12).toLocaleDateString('tr-TR',{month:'long',year:'numeric'})}
function toggleInvoicePaid(key){x.invoiceStatus=x.invoiceStatus||{};x.invoiceStatus[key]=x.invoiceStatus[key]==='paid'?'pending':'paid';save();render()}
function invoiceCard(){
 const now=new Date(), inv=invoiceFor(now.getFullYear(),now.getMonth());
 return `<div class="card"><div class="spaced"><b>🧾 ${esc(invoiceLabel(inv))} Faturası</b><span class="pill">${inv.status==='paid'?'✅ Ödendi':'⏳ Bekleniyor'}</span></div><div class="muted" style="margin:6px 0 12px">Paket dönemi: ${inv.packetStart} → ${inv.packetEnd}<br>KM dönemi: ${inv.mileageStart} → ${inv.end}<br>Ödeme tarihi: ${inv.payDate}</div><div class="row"><span>📦 Paket kazancı</span><b class="green">${tl(inv.packageAmount)}</b></div><div class="row"><span>📏 Kilometre kazancı</span><b class="green">${tl(inv.kmAmount)}</b></div><div class="row"><span><b>🧾 Toplam fatura</b></span><b class="green">${tl(inv.total)}</b></div><button class="btn ${inv.status==='paid'?'secondary':''}" onclick="toggleInvoicePaid('${inv.key}')">${inv.status==='paid'?'↩️ Ödenmedi olarak işaretle':'✅ Ödendi olarak işaretle'}</button><button class="btn secondary" onclick="showInvoiceHistory()">📅 Fatura geçmişi</button></div>`;
}
function showInvoiceHistory(){
 const now=new Date(), rows=[]; for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1,12),inv=invoiceFor(d.getFullYear(),d.getMonth());rows.push(`<div class="row"><span><b>${esc(invoiceLabel(inv))}</b><br><span class="muted">📦 ${inv.packetStart} → ${inv.packetEnd}<br>📏 ${inv.mileageStart} → ${inv.end}<br>Ödeme: ${inv.payDate}</span></span><span style="text-align:right"><b>${tl(inv.total)}</b><br><span class="pill">${inv.status==='paid'?'✅ Ödendi':'⏳ Bekleniyor'}</span></span></div>`)}
 modal(`<h2>🧾 Son 12 Fatura</h2><div>${rows.join('')}</div><button class="btn secondary" onclick="closeM()">Kapat</button>`);
}

let page='home';
function show(p){page=p;render()}
function modal(s){m.innerHTML=s;if(typeof d.showModal==='function')d.showModal();else d.setAttribute('open','')}
function closeM(){if(typeof d.close==='function')d.close();else d.removeAttribute('open')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function periodData(start,end){return {deliveries:x.deliveries.filter(v=>inRange(v.date,start,end)),mileage:x.mileage.filter(v=>inRange(v.date,start,end)),expenses:x.expenses.filter(v=>inRange(v.date,start,end)),debtPayments:x.debtPayments.filter(v=>inRange(v.date,start,end))}}
function totals(data){const inc=incomeFor(data), exp=sum(data.expenses), debtOut=sum(data.debtPayments);return {inc,exp,debtOut,outflow:exp+debtOut,net:inc-exp-debtOut}}
function signClass(v){return Number(v)>0?'positive':Number(v)<0?'negative':'neutral'}
function renderNav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+page)?.classList.add('active')}
function render(){
 let h='';
 if(page==='home'){
  const t=today(),data=periodData(t,t),q=totals(data),debt=x.debts.reduce((s,v)=>s+(Number(v.remaining)||0),0);
  h=`<h1>Finans Takip</h1><div class="card hero"><div>Bugünün Kâr / Zararı</div><div class="big ${signClass(q.net)}">${tl(q.net)}</div><div style="color:#fff;opacity:.95">Gelir ${tl(q.inc)} · Çıkış ${tl(q.outflow)}</div></div><div class="stats"><div class="card"><div class="muted">📦 Toplam Kazanç</div><b class="green">${tl(q.inc)}</b></div><div class="card"><div class="muted">💸 Toplam Gider</div><b class="outflow">${tl(q.outflow)}</b></div></div><div class="card"><div class="spaced"><b>💳 Toplam Borç</b><b class="red">${tl(debt)}</b></div><div class="muted">Tüm aktif banka, kredi kartı ve elden borçlar</div></div><div class="card"><b>📅 Bu Ay Özeti</b><div class="stats" style="margin-top:8px"><div class="stat"><span class="muted">Gelir</span><br><b class="green">${tl(totals(periodData(dateStr(new Date(new Date().getFullYear(),new Date().getMonth(),1,12)),today())).inc)}</b></div><div class="stat"><span class="muted">Gider</span><br><b class="outflow">${tl(totals(periodData(dateStr(new Date(new Date().getFullYear(),new Date().getMonth(),1,12)),today())).exp)}</b></div><div class="stat"><span class="muted">Borç ödemesi</span><br><b class="outflow">${tl(totals(periodData(dateStr(new Date(new Date().getFullYear(),new Date().getMonth(),1,12)),today())).debtOut)}</b></div><div class="stat"><span class="muted">Net</span><br><b class="${signClass(totals(periodData(dateStr(new Date(new Date().getFullYear(),new Date().getMonth(),1,12)),today())).net)}">${tl(totals(periodData(dateStr(new Date(new Date().getFullYear(),new Date().getMonth(),1,12)),today())).net)}</b></div></div></div>`;
 } else if(page==='courier'){
  const t=today(),p=x.deliveries.filter(v=>v.date===t),km=x.mileage.filter(v=>v.date===t).reduce((s,v)=>s+(Number(v.km)||0),0),mk=x.mileage.filter(v=>v.date===t).reduce((s,v)=>s+(Number(v.km)||0)*(Number(v.rate)||0),0),ps=p.reduce((s,v)=>s+(Number(v.orders)||1),0),dayExp=sum(x.expenses.filter(v=>v.date===t)),dayDebt=sum(x.debtPayments.filter(v=>v.date===t)),dayIncome=sum(p)+mk,dayNet=dayIncome-dayExp-dayDebt;
  h=`<h1>📦 Kurye Kazancı</h1><div class="card hero"><div>Bugünkü Kâr / Zarar</div><div class="big ${signClass(dayNet)}">${tl(dayNet)}</div><div style="color:#fff;opacity:.9">${p.reduce((s,v)=>s+(Number(v.first)||0),0)} ilk + ${p.reduce((s,v)=>s+(Number(v.merged)||0),0)} birleşen = ${ps} toplam sipariş · ${km} km</div></div><button class="btn" onclick="addP()">+ Sipariş</button><button class="btn secondary" onclick="addK()">+ Gün Sonu KM</button><div class="card"><div class="row"><span>Sipariş geliri</span><b class="green">${tl(sum(p))}</b></div><div class="row"><span>KM geliri</span><b class="green">${tl(mk)}</b></div><div class="row"><span>Günlük gider</span><b class="outflow">${tl(dayExp)}</b></div><div class="row"><span>Borç/kart ödemesi</span><b class="outflow">${tl(dayDebt)}</b></div><div class="row"><span>Net kâr / zarar</span><b class="${signClass(dayNet)}">${tl(dayNet)}</b></div></div><div class="card">${(()=>{const now=new Date(),inv=invoiceFor(now.getFullYear(),now.getMonth()),orders=inv.deliveries.reduce((s,v)=>s+(Number(v.orders)||1),0),first=inv.deliveries.reduce((s,v)=>s+(Number(v.first)||1),0),merged=inv.deliveries.reduce((s,v)=>s+(Number(v.merged)||0),0),km=inv.mileage.reduce((s,v)=>s+(Number(v.km)||0),0),expenses=sum(x.expenses.filter(v=>inRange(v.date,inv.mileageStart,inv.end))),payments=sum(x.debtPayments.filter(v=>inRange(v.date,inv.mileageStart,inv.end))),net=inv.total-expenses-payments;return `<b>📈 ${esc(invoiceLabel(inv))} Kurye Analizi</b><div class="muted" style="margin:6px 0 10px">📦 Paket: ${inv.packetStart} → ${inv.packetEnd}<br>📏 KM: ${inv.mileageStart} → ${inv.end}</div><div class="stats" style="margin-top:8px"><div class="stat"><span class="muted">Sipariş</span><br><b>${first} ilk + ${merged} birleşen = ${orders}</b></div><div class="stat"><span class="muted">KM</span><br><b>${km.toLocaleString('tr-TR')} km</b></div><div class="stat"><span class="muted">Paket kazancı</span><br><b class="green">${tl(inv.packageAmount)}</b></div><div class="stat"><span class="muted">KM kazancı</span><br><b class="green">${tl(inv.kmAmount)}</b></div></div><div class="row"><span><b>Fatura toplamı</b></span><b class="green">${tl(inv.total)}</b></div><div class="row"><span>Bu dönem gider</span><b class="outflow">− ${tl(expenses)}</b></div><div class="row"><span>Borç/kart ödemesi</span><b class="outflow">− ${tl(payments)}</b></div><div class="row"><span><b>Net</b></span><b class="${signClass(net)}">${tl(net)}</b></div>`})()}</div>${invoiceCard()}${p.map(v=>`<div class="card"><div class="spaced"><span><b>${Number(v.first)||1} İlk + ${Number(v.merged)||0} Birleşen</b><br><span class="muted">${dt(v.at||v.date)}</span></span><b class="green">${tl(v.amount)}</b></div><button class="btn danger" onclick="undoDelivery('${v.id}')">Sil / Geri Al</button></div>`).join('')} ${x.mileage.filter(v=>v.date===t).map(v=>`<div class="card"><div class="spaced"><span>🛣️ ${v.km} km × ${tl(v.rate)}<br><span class="muted">${dt(v.at||v.date)}</span></span><b class="green">${tl((Number(v.km)||0)*(Number(v.rate)||0))}</b></div><button class="btn danger" onclick="undoMileage('${v.id}')">Sil / Geri Al</button></div>`).join('')}`;
 } else if(page==='expense'){
  const ef=normalizeExpenseFilter();
  const filteredExpenses=x.expenses.filter(v=>expenseMatches(v,ef));

function normalizeExpenseFilter(){
 const ef=window.expenseFilter||{};
 const now=new Date(),monthStart=dateStr(new Date(now.getFullYear(),now.getMonth(),1,12)),todayStr=today();
 let mode=ef.mode||((ef.start||ef.end)?'custom':'all');
 let start=ef.start||'',end=ef.end||'';
 if(mode==='month'){start=monthStart;end=todayStr}
 if(start&&end&&end<start){const t=start;start=end;end=t}
 if(mode==='all'){start='';end=''}
 window.expenseFilter={start,end,category:ef.category||'all',mode};
 return window.expenseFilter;
}
function expenseMatches(v,ef){
 const ds=String(v.date||'').slice(0,10);
 if(ef.mode==='all')return ef.category==='all'||v.category===ef.category;
 return (!ef.start||ds>=ef.start)&&(!ef.end||ds<=ef.end)&&(ef.category==='all'||v.category===ef.category);
}

function undoMileage(id){const v=x.mileage.find(v=>v.id===id);if(!v)return;confirmUndo(`KM geliri (${v.km} km)`,()=>{const i=x.mileage.findIndex(v=>v.id===id);if(i<0)return;x.mileage.splice(i,1);log('cancel','❌ KM geliri iptal edildi',(Number(v.km)||0)*(Number(v.rate)||0),{entity:'mileage',entityId:id});save();render()})}
function undoExpense(id){const v=x.expenses.find(v=>v.id===id);if(!v)return;confirmUndo(`Gider (${v.category} - ${tl(v.amount)})`,()=>{const i=x.expenses.findIndex(v=>v.id===id);if(i<0)return;const debt=v.debtId?x.debts.find(d=>d.id===v.debtId):null;if(debt&&v.paymentMethod==='credit_card'){debt.remaining=Math.max(0,(Number(debt.remaining)||0)-Number(v.amount||0));debt.total=Math.max(0,(Number(debt.total)||0)-Number(v.amount||0));log('neutral',`Kredi kartı harcaması geri alındı: ${debt.name}`,v.amount,{entity:'expenseCreditUndo',entityId:id,debtId:debt.id})}x.expenses.splice(i,1);log('cancel',`❌ Gider iptal edildi: ${v.category}`,v.amount,{entity:'expense',entityId:id});save();render()})}

function undoDebtPayment(id){const pm=x.debtPayments.find(v=>v.id===id),d=x.debts.find(v=>v.id===pm?.debtId);if(!pm||!d)return;confirmUndo(`Borç ödemesi (${tl(pm.amount)})`,()=>{const i=x.debtPayments.findIndex(v=>v.id===id);if(i<0)return;d.remaining=(Number(d.remaining)||0)+Number(pm.amount||0);d.paid=Math.max(0,(Number(d.paid)||0)-Number(pm.amount||0));delete d.closedAt;x.debtPayments.splice(i,1);log('cancel',`❌ Borç ödemesi iptal edildi: ${d.name}`,pm.amount,{entity:'debtPayment',entityId:id});save();render()})}
function removeDebtPaymentRecord(id){const pm=x.debtPayments.find(v=>v.id===id);if(!pm)return;confirmUndo(`Yalnızca raporlardaki ödeme kaydını kaldır (${tl(pm.amount)}). Borcun kalan/ödenen bakiyesi değişmeyecek.`,()=>{const i=x.debtPayments.findIndex(v=>v.id===id);if(i<0)return;const old=x.debtPayments.splice(i,1)[0],removedLogs=[];for(let j=x.logs.length-1;j>=0;j--){const entry=x.logs[j];if(entry.entity==='debtPayment'&&entry.entityId===id)removedLogs.unshift(x.logs.splice(j,1)[0])}if(!save()){x.debtPayments.splice(i,0,old);x.logs.push(...removedLogs);return}render()})}
function adminView(){const logs=(x.logs||[]).slice().reverse();return `<h1>🛠️ Admin Paneli</h1><div class="card"><div class="spaced"><b>İşlem Geçmişi</b><span class="pill">${logs.length} kayıt</span></div><div class="muted" style="margin-top:6px">Tüm gelir, gider ve iptal işlemleri tarih ve saat sırasıyla tutulur.</div></div><div class="card">${logs.map(v=>{const cancel=v.type==='cancel',income=v.type==='income',cls=cancel?'cancel-log':income?'income-log':'expense-log',icon=cancel?'❌':income?'🟢 +':'🔴 −';return `<div class="admin-log ${cls}"><div><b>${icon} ${esc(v.text)}</b><div class="muted">${dt(v.at)}</div></div><strong>${v.amount?tl(v.amount):''}</strong></div>`}).join('')||'<div class="muted">Henüz işlem kaydı yok.</div>'}</div>`}
function settingsView(){
 const dark=document.body.classList.contains('dark');
 const last=x.lastBackupAt?new Date(x.lastBackupAt).toLocaleString('tr-TR'):'Henüz yedek alınmadı';
 return `<h1>⚙️ Ayarlar</h1>
 <div class="card"><b>💰 Kurye Kazanç Tarifeleri</b><div class="muted" style="margin:6px 0 10px">Buradan güncel tarifeleri değiştirebilirsin. Yeni kayıtlar yeni tarifeyi kullanır; eski kayıtların kazancı değişmez.</div><label class="small">Kilometre başı ücret (TL)</label><input id="setKmRate" type="text" inputmode="decimal" value="${String(Number(x.rate)||7.5).replace('.',',')}"><label class="small">İlk sipariş (TL)</label><input id="setFirstRate" type="text" inputmode="decimal" value="${String(Number(x.firstRate)||125).replace('.',',')}"><label class="small">Birleşen sipariş (TL)</label><input id="setMergedRate" type="text" inputmode="decimal" value="${String(Number(x.mergedRate)||85).replace('.',',')}"><button class="btn" onclick="saveRates()">Tarifeleri Kaydet</button><div class="status">Şu an: ${tl(Number(x.rate)||0)}/km · ${tl(Number(x.firstRate)||0)} ilk · ${tl(Number(x.mergedRate)||0)} birleşen</div></div>
 <div class="card"><b>🎨 Görünüm</b><div class="settings-row"><span>Açık / Koyu tema</span><select onchange="setTheme(this.value)"><option value="light" ${!dark?'selected':''}>Açık Tema</option><option value="dark" ${dark?'selected':''}>Koyu Tema</option></select></div></div>
 <div class="card"><b>🔐 Veri Yedekleme</b><div id="backupStatus" class="status">Son yedek: ${esc(last)}</div><button class="btn" onclick="manualBackup()">📤 Yedeği Dışa Aktar</button><button class="btn secondary" onclick="document.getElementById('backupFile').click()">📥 Yedeği Geri Yükle</button><input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this.files[0])"><div class="muted" style="margin-top:10px">Günlük otomatik yedek telefonun içinde hazırlanır. iCloud Drive'a göndermek için iOS paylaşım ekranından iCloud Drive'ı seçmen gerekir.</div></div>
 <div class="card"><b>☁️ Günlük Yedek</b><div class="muted" style="margin:8px 0">Uygulama her gün ilk açıldığında otomatik bir yedek dosyası oluşturur. iOS, web uygulamalarının iCloud Drive'a sessizce dosya yazmasına izin vermediği için iCloud'a kaydetme işlemi bir dokunuşla yapılır.</div><button class="btn secondary" onclick="dailyBackup(true)">☁️ Bugünkü Yedeği iCloud'a Kaydet</button></div>`;
}
function saveRates(){const km=num(document.getElementById('setKmRate')?.value),first=num(document.getElementById('setFirstRate')?.value),merged=num(document.getElementById('setMergedRate')?.value);if(!Number.isFinite(km)||km<0||!Number.isFinite(first)||first<0||!Number.isFinite(merged)||merged<0)return alert('Tarifeleri doğru gir. Örnek: 7,5 veya 7.5');x.rate=km;x.firstRate=first;x.mergedRate=merged;save();render();alert('✅ Yeni kurye tarifeleri kaydedildi.');}
function setTheme(v){document.body.classList.toggle('dark',v==='dark');localStorage.setItem('finansTheme',v)}
function backupObject(){const data=JSON.parse(JSON.stringify(x));delete data.autoBackup;return {format:'FinansTakipBackup',version:4,exportedAt:new Date().toISOString(),data}}
function downloadBackup(){const blob=new Blob([JSON.stringify(backupObject(),null,2)],{type:'application/json'});const a=document.createElement('a');const d=new Date();const fn=`FinansTakip_Yedek_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);x.lastBackupAt=new Date().toISOString();save();render();setTimeout(()=>alert('✅ Yedek oluşturuldu. Şimdi Dosyalar > iCloud Drive konumunu seçerek kaydedebilirsin.'),80)}
async function shareBackup(){const blob=new Blob([JSON.stringify(backupObject(),null,2)],{type:'application/json'});const d=new Date();const fn=`FinansTakip_Yedek_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;const file=new File([blob],fn,{type:'application/json'});if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){try{await navigator.share({title:'Finans Takip Yedeği',files:[file]});x.lastBackupAt=new Date().toISOString();save();render();setTimeout(()=>alert("✅ Yedek hazırlandı. Paylaşım ekranından iCloud Drive'ı seçerek kaydedebilirsin."),80);return true}catch(e){if(e.name==='AbortError')return false}}downloadBackup();return true}
function manualBackup(){shareBackup()}
function dailyBackup(force=false){
 const key=today();
 if(!force && x.lastAutoBackupDate===key)return;
 const snapshot=JSON.parse(JSON.stringify(x));
 delete snapshot.autoBackup;
 x.lastAutoBackupDate=key;
 x.lastBackupAt=new Date().toISOString();
 x.autoBackup={format:'FinansTakipBackup',version:3,exportedAt:new Date().toISOString(),data:snapshot};
 save();
 if(force)shareBackup();
}

function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);const d=b.data||b;if(!d||!Array.isArray(d.deliveries)||!Array.isArray(d.expenses)||!Array.isArray(d.debts))throw new Error('Geçersiz yedek');if(!confirm('Bu işlem mevcut verilerin üzerine yedeği yükleyecek. Devam edilsin mi?'))return;x=d;delete x.autoBackup;if(!Array.isArray(x.deliveries))x.deliveries=[];if(!Array.isArray(x.mileage))x.mileage=[];if(!Array.isArray(x.expenses))x.expenses=[];if(!Array.isArray(x.debts))x.debts=[];if(!Array.isArray(x.debtPayments))x.debtPayments=[];if(!Array.isArray(x.logs))x.logs=[];if(!Array.isArray(x.categories))x.categories=['Market','Akaryakıt','Hobi','Eğlence','Fatura','Araç Bakım','Parça Maliyeti'];if(!x.invoiceStatus||typeof x.invoiceStatus!=='object')x.invoiceStatus={};x.debts.forEach(v=>{if((Number(v.remaining)||0)<=0&&!v.closedAt)v.closedAt=today()});save();alert('Yedek başarıyla geri yüklendi.');render()}catch(e){alert('Yedek dosyası okunamadı. Lütfen Finans Takip tarafından oluşturulmuş JSON dosyası seç.')}};r.readAsText(file)}
function reportView(){
 const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1);let start=dateStr(first),end=today();
 const s=window.reportStart||start,e=window.reportEnd||end;const data=periodData(s,e),q=totals(data);const cats={};data.expenses.forEach(v=>cats[v.category]=(cats[v.category]||0)+(Number(v.amount)||0));if(q.debtOut)cats['Borç / Kredi Kartı Ödemeleri']=q.debtOut;
 return `<h1>📊 Raporlar</h1><div class="card"><b>Özel tarih aralığı</b><div class="muted" style="margin:6px 0 10px">Takvimden başlangıç ve bitiş gününü seç.</div><div class="spaced"><input id="rstart" type="date" value="${s}" onchange="window.reportStart=this.value;render()"><input id="rend" type="date" value="${e}" onchange="window.reportEnd=this.value;render()"></div><div class="calendar-wrap">${calendarHtml(s,e)}</div></div><div class="stats"><div class="stat"><span class="muted">Gelir</span><br><b class="green">${tl(q.inc)}</b></div><div class="stat"><span class="muted">Gider</span><br><b class="outflow">${tl(q.outflow)}</b></div><div class="stat"><span class="muted">Net</span><br><b class="${signClass(q.net)}">${tl(q.net)}</b></div><div class="stat"><span class="muted">Sipariş</span><br><b>${data.deliveries.reduce((s,v)=>s+(Number(v.first)||1),0)} İlk + ${data.deliveries.reduce((s,v)=>s+(Number(v.merged)||Math.max(0,(Number(v.orders)||1)-1)),0)} Birleşen = ${data.deliveries.reduce((s,v)=>s+(Number(v.orders)||1),0)} Toplam</b></div><div class="stat"><span class="muted">Toplam KM</span><br><b>${data.mileage.reduce((s,v)=>s+(Number(v.km)||0),0).toLocaleString('tr-TR')} km</b></div><div class="stat"><span class="muted">KM Kazancı</span><br><b class="green">${tl(data.mileage.reduce((s,v)=>s+(Number(v.km)||0)*(Number(v.rate)||0),0))}</b></div></div><div class="card"><b>Harcama dağılımı</b>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`<div class="cat"><span>${esc(c)}</span><b>${tl(a)}</b></div>`).join('')||'<div class="muted" style="margin-top:10px">Bu aralıkta gider yok.</div>'}</div><div class="card"><b>Gün gün</b>${dailyReport(s,e)}</div>`
}
function calendarHtml(start,end){const sd=new Date(start+'T12:00:00'),ed=new Date(end+'T12:00:00');let y=sd.getFullYear(),m=sd.getMonth();let first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,h='<div class="calendar">';['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].forEach(d=>h+=`<div class="calhead">${d}</div>`);for(let i=0;i<lead;i++)h+='<div></div>';for(let d=1;d<=days;d++){const ds=dateStr(new Date(y,m,d,12));const cls=(ds===start?' start ':'')+(ds===end?' end ':'')+(ds>=start&&ds<=end?' inrange':'');h+=`<button class="day${cls}" onclick="calendarPick('${ds}')">${d}</button>`}return h+'</div>'}
let selectingStart=true;
function calendarPick(ds){if(selectingStart){window.reportStart=ds;selectingStart=false}else{window.reportEnd=ds;if(window.reportEnd<window.reportStart){const t=window.reportStart;window.reportStart=window.reportEnd;window.reportEnd=t}selectingStart=true}render()}
function dailyReport(s,e){let out='';for(let d=new Date(s+'T12:00:00');dateStr(d)<=e;d.setDate(d.getDate()+1)){const ds=dateStr(d),data=periodData(ds,ds),q=totals(data);if(q.inc||q.exp)out+=`<div class="row"><span>${ds}<br><span class="muted">Gelir ${tl(q.inc)} · Gider ${tl(q.exp)} · Borç/Kart ${tl(q.debtOut)}</span></span><b class="${signClass(q.net)}">${tl(q.net)}</b></div>`}return out||'<div class="muted" style="margin-top:10px">Seçilen aralıkta işlem yok.</div>'}
const savedTheme=localStorage.getItem('finansTheme')||'light';document.body.classList.toggle('dark',savedTheme==='dark');dailyBackup();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
